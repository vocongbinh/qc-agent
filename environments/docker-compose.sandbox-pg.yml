services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: catalog_service
    ports:
      - "${SANDBOX_PG_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d catalog_service"]
      interval: 2s
      timeout: 3s
      retries: 30
