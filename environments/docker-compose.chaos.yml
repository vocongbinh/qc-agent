# Chaos lab – Redis, Postgres, Kafka (Redpanda), Toxiproxy
#
# Usage:
#   docker compose -f environments/docker-compose.chaos.yml up -d
#   docker compose -f environments/docker-compose.chaos.yml ps
#   docker compose -f environments/docker-compose.chaos.yml down
#
# Toxiproxy upstream mặc định (trong .env / settings):
#   APP_UPSTREAM_HOST=host.docker.internal
#   APP_UPSTREAM_PORT=8000
# → proxy listen localhost:18080 → app trên máy host :8000

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redpanda = Kafka API tương thích, nhẹ hơn bitnami kafka cho local chaos
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:9092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://kafka:8082,external://localhost:8082
    ports:
      - "9092:9092"     # Kafka broker (external advertised as localhost:9092)
      - "19092:19092"
      - "8082:8082"     # Pandaproxy (HTTP produce/consume – tiện probe)
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    ports:
      - "8474:8474"     # Admin API
      - "18080:18080"   # api_proxy listen → app upstream
      - "19093:19093"   # optional: kafka_proxy listen → kafka
    extra_hosts:
      # Cho phép upstream host.docker.internal từ trong container (Linux + Docker Desktop)
      - "host.docker.internal:host-gateway"
